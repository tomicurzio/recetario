<!doctype html>
<html lang="es" data-theme="light">
<meta name="color-scheme" content="light only">
<meta charset="utf-8">
<meta name="theme-color" content="#F7F6F3">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recetario</title>
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Recetario">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3;--card:#FFFFFF;--tile:#F1F0EC;--ink:#1A1C1E;--ink2:#6B6F74;--muted:#9A9C9E;--ph:#C9C6BF;--line:#E8E6E1;
  --accent:#3A5171;--accent-ink:#3A5171;--accent-soft:#E3E8ED;--on-accent-2:#CFD8E3;--danger:#D9442E;--danger-soft:#F7DAD5;
  --glass:rgba(255,255,255,.6);--glass-hi:rgba(255,255,255,.72);--glass-sheet:rgba(250,249,246,.86);--glass-edge:rgba(255,255,255,.9);
  --sh:0 6px 18px rgba(38,33,20,.10);--sh-accent:0 8px 20px rgba(26,42,64,.28);
  --dim:rgba(26,28,30,.14);--bg-dimmed:#D8D7D5;--gx:max(24px,env(safe-area-inset-left));--gxr:max(24px,env(safe-area-inset-right));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315;--card:#1C1D20;--tile:#25262A;--ink:#F2F1EE;--ink2:#A3A6AB;--muted:#74777C;--ph:#55585D;--line:#2C2D31;
  --accent:#3A5171;--accent-ink:#9DB3D1;--accent-soft:#222A36;--danger:#E8644F;--danger-soft:#3A2420;
  --glass:rgba(44,45,49,.6);--glass-hi:rgba(255,255,255,.14);--glass-sheet:rgba(30,31,34,.9);--glass-edge:rgba(255,255,255,.1);--sh:0 6px 18px rgba(0,0,0,.35);--dim:rgba(0,0,0,.45);--bg-dimmed:#0A0A0C;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121315;--card:#1C1D20;--tile:#25262A;--ink:#F2F1EE;--ink2:#A3A6AB;--muted:#74777C;--ph:#55585D;--line:#2C2D31;
  --accent:#3A5171;--accent-ink:#9DB3D1;--accent-soft:#222A36;--danger:#E8644F;--danger-soft:#3A2420;
  --glass:rgba(44,45,49,.6);--glass-hi:rgba(255,255,255,.14);--glass-sheet:rgba(30,31,34,.9);--glass-edge:rgba(255,255,255,.1);--sh:0 6px 18px rgba(0,0,0,.35);--dim:rgba(0,0,0,.45);--bg-dimmed:#0A0A0C;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.45;font-weight:400;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
svg{display:block;flex:none}
img{display:block}

/* ---------- type (Figma text styles) ---------- */
.d-xl{font-size:150px;line-height:1;letter-spacing:-.06em;font-weight:500}
.d-m{font-size:38px;line-height:1.04;letter-spacing:-.03em;font-weight:500}
.d-mr{font-size:38px;line-height:1.04;letter-spacing:-.03em;font-weight:400}
.t-m{font-size:28px;line-height:1.1;letter-spacing:-.03em;font-weight:500}
.hl{font-size:20px;line-height:1.2;letter-spacing:-.02em;font-weight:500}
.bl-m{font-size:17px;line-height:1.3;letter-spacing:-.01em;font-weight:500}
.bm{font-size:16px;line-height:1.45;font-weight:400}
.bm-m{font-size:16px;line-height:1.3;letter-spacing:-.01em;font-weight:500}
.lbl{font-size:14px;line-height:1.2;font-weight:500}
.cap{font-size:13px;line-height:1.3;font-weight:400}
.c2{color:var(--ink2)}.cm{color:var(--muted)}.ca{color:var(--accent-ink)}.cd{color:var(--danger)}
h1,h2,h3,p{margin:0}

/* ---------- desktop gate ---------- */
#desk{display:none;min-height:100vh;grid-template-columns:1fr 1fr}
#desk .dleft{position:relative;background:var(--accent);overflow:hidden;min-height:100vh}
#desk .dwall{position:absolute;left:-99px;top:-164px;display:flex;flex-direction:column;gap:20.86px;transform:rotate(6deg) scale(1.353);transform-origin:0 0;pointer-events:none}
#desk .wrow{display:flex;gap:20.86px}
#desk .rc{width:150px;flex:none;box-shadow:none}
#desk .rc .nm{-webkit-line-clamp:1}
#desk .dright{display:flex;flex-direction:column;justify-content:center;gap:24px;padding:48px clamp(48px,7vw,120px)}
#desk .dtitle{font-size:56px;line-height:1.04;letter-spacing:-.03em;font-weight:500}
#desk .bl{font-size:17px;line-height:1.4}
#desk .qrc{display:flex;align-items:center;gap:20px;padding:20px 28px 20px 20px;border-radius:28px;background:var(--card);box-shadow:0 6px 18px rgba(38,33,20,.08);align-self:flex-start;color:var(--ink)}
@media (min-width:820px) and (hover:hover) and (pointer:fine){
  #app,#layer,#toasts{display:none!important}
  #desk{display:grid}
}
/* ---------- layout ---------- */
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.screen{min-height:100dvh;display:flex;flex-direction:column;padding-top:max(12px,env(safe-area-inset-top))}
.screen.enter{animation:in .2s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px var(--gxr) 16px max(16px,env(safe-area-inset-left));min-height:76px}
.nav.r16{padding-right:max(16px,env(safe-area-inset-right))}
.nav .mid{flex:1;text-align:center}
.body{flex:1;display:flex;flex-direction:column;gap:24px;padding:0 var(--gxr) 24px var(--gx)}
.foot{position:sticky;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:16px var(--gxr) max(24px,calc(env(safe-area-inset-bottom) + 8px)) var(--gx);background:linear-gradient(to bottom,rgba(247,246,243,0),var(--bg) 24px)}
.foot.row{flex-direction:row;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column}
.g4{gap:4px}.g8{gap:8px}.g12{gap:12px}.g16{gap:16px}.g24{gap:24px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:0 var(--gxr) 0 var(--gx)}
.hidden{display:none!important}

/* ---------- buttons ---------- */
.btn{height:56px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:0 28px;white-space:nowrap;transition:transform .12s,opacity .15s;font-size:17px;line-height:1.3;letter-spacing:-.01em;font-weight:500}
a.btn{text-decoration:none}
.btn:active{transform:scale(.98)}
.btn.pri{background:rgba(58,81,113,.94);color:#fff;box-shadow:var(--sh-accent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri[disabled]{opacity:.42;box-shadow:none;pointer-events:none}
.btn.txt{color:var(--ink2);height:48px}
.btn.txt[disabled]{color:var(--ph);pointer-events:none}
.btn.sec{background:var(--card);color:var(--ink);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--danger);color:#fff;box-shadow:0 8px 20px rgba(217,68,46,.28)}
.btn.sm{height:40px;padding:0 18px;font-size:16px;letter-spacing:-.01em}
.btn.wide{width:100%}
.btn.lightglass{background:rgba(255,255,255,.6);color:var(--ink);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.btn.darkglass{background:rgba(255,255,255,.16);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.ib{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--ink);background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);box-shadow:var(--sh),inset 0 1px 0 var(--glass-edge),inset 0 0 0 .5px rgba(255,255,255,.5)}
.ib.dark{background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.3)}
.ib:active{transform:scale(.95)}
.fab{position:fixed;z-index:20;right:max(24px,calc(50% - 216px));bottom:max(24px,calc(env(safe-area-inset-bottom) + 12px));width:60px;height:60px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(58,81,113,.92);-webkit-backdrop-filter:blur(12px) saturate(1.5);backdrop-filter:blur(12px) saturate(1.5);box-shadow:var(--sh-accent),inset 0 1px 0 rgba(255,255,255,.25)}
.fab:active{transform:scale(.95)}

/* ---------- fields ---------- */
.field{display:flex;flex-direction:column;gap:8px}
.input{width:100%;height:52px;border-radius:16px;border:0;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);padding:0 18px;outline:none;font-size:16px;line-height:1.45}
.input::placeholder,.bare::placeholder{color:var(--ph);opacity:1}
.input:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.input.err{box-shadow:inset 0 0 0 1.5px var(--danger)}
textarea.input{height:auto;min-height:120px;padding:14px 18px;resize:none}
.bare{border:0;background:none;outline:none;padding:0;width:100%;caret-color:var(--accent)}
textarea.bare{resize:none;display:block}
.stepper{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 6px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--sh),inset 0 1px 0 var(--glass-edge)}
.stepper button{width:36px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.stepper button:active{background:var(--tile)}
.stepper span{min-width:30px;text-align:center}
.stepper.wide span[data-sv]{padding:0 4px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:34px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink2);font-size:14px;line-height:1.2;font-weight:500;position:relative;white-space:nowrap}
.chip.on,.chip.soft{background:var(--accent-soft);box-shadow:none;color:var(--accent-ink)}
.chip.soft.sm{height:30px;padding:0 10px}
.chip select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}

/* ---------- rows ---------- */
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;border-bottom:1px solid var(--line)}
.ecard{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 10px 0 18px;border-radius:16px;background:var(--card)}
.ecard .q{width:72px;flex:none;color:var(--accent-ink)}
.ecard .x{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.scard{display:flex;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card)}
.scard .n{color:var(--accent-ink);flex:none;min-width:22px}
.scard textarea{flex:1;min-height:46px}
.scard.ed{padding:12px 6px 10px 12px;gap:10px}
.sord{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;min-width:28px}
.sord .n{padding-top:1px;margin-bottom:2px}
.sb{width:28px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sb:active{background:var(--tile)}
.sb[disabled]{opacity:.3;pointer-events:none}
.scard .x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;border-radius:999px;margin-top:-6px}
.addrow{display:inline-flex;align-items:center;gap:10px;color:var(--ink2);height:40px;align-self:flex-start}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:3px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--accent)}
.prog.light i{background:rgba(255,255,255,.28)}.prog.light i.on{background:#fff}
.rcheck{width:22px;height:22px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ph);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.rcheck.on{background:var(--accent);box-shadow:none}
.pick{display:flex;align-items:center;gap:12px;min-height:40px;border-bottom:1px solid var(--line);width:100%}
.pick .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- surfaces ---------- */
.tile{background:var(--tile);border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.ill{width:100%;height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.photo{width:100%;height:100%;object-fit:cover}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:16px;font-size:14px;line-height:1.2;font-weight:500}
.notice.accent{background:var(--accent-soft);color:var(--accent-ink)}
.notice.danger{background:var(--danger-soft);color:var(--danger)}
.notice svg{margin-top:-1px}
.skel{background:var(--tile);border-radius:8px}

/* ---------- home ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rc{background:var(--card);border-radius:28px;padding:6px;display:flex;flex-direction:column;gap:0;position:relative;box-shadow:0 1px 2px rgba(38,33,20,.04)}
.rc:active{transform:scale(.98)}
.rc .tile{height:120px;border-radius:20px}
.rc .tile .ill{width:84%;height:84%}
.rc .tx{padding:12px 8px 10px;display:flex;flex-direction:column;gap:2px;text-align:left}
.rc .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc .fav{position:absolute;top:14px;right:14px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.resume{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;border-radius:20px;background:var(--accent);color:#fff;text-align:left;box-shadow:var(--sh-accent)}
.resume .tx{flex:1;min-width:0}
.resume .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:999px;padding:0 6px 0 16px;background:var(--glass);box-shadow:var(--sh),inset 0 1px 0 var(--glass-edge);flex:1;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}

.ib.avatar{color:var(--accent-ink)}
.avatar.big{width:88px;height:88px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:var(--sh),inset 0 1px 0 var(--glass-edge),inset 0 0 0 1px rgba(255,255,255,.6);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;letter-spacing:-.02em}
/* ---------- welcome ---------- */
.screen.welcome{padding-top:0}
.wcover{flex:1;min-height:400px;background:var(--accent);position:relative;overflow:hidden}
.wall{position:absolute;left:calc(50% - 180px - 129.7px);top:-72px;display:flex;flex-direction:column;gap:17.07px;transform:rotate(6deg) scale(.82);transform-origin:0 0;pointer-events:none}
.wrow{display:flex;gap:17.07px}
.wall .rc{width:150px;flex:none;box-shadow:none}
.wall .rc .nm{-webkit-line-clamp:1}
.wfav{position:absolute;left:calc(50% - 180px + 210px);top:149px;pointer-events:none}
.wsheet{position:relative;margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:12px;padding:32px var(--gxr) max(32px,calc(env(safe-area-inset-bottom) + 16px)) var(--gx)}
/* ---------- keep cooking ---------- */
.resume2{position:relative;display:flex;align-items:center;background:var(--card);border-radius:24px;box-shadow:0 1px 2px rgba(38,33,20,.04)}
.rtap{flex:1;display:flex;align-items:center;gap:14px;padding:8px 48px 8px 8px;text-align:left;min-width:0}
.rtap:active{opacity:.8}
.rtile{width:72px;height:72px;border-radius:18px;background:var(--tile);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.rtile .ill{width:86%;height:86%}
.rtx{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.rtx b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar{display:block;height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0 4px}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.rx{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.rx:active{background:var(--tile)}
/* ---------- home tabs ---------- */
@keyframes tabInR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes tabInL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.04)}100%{transform:none}}
.body.tab-in-r{animation:tabInR .28s cubic-bezier(.2,.8,.2,1)}
.body.tab-in-l{animation:tabInL .28s cubic-bezier(.2,.8,.2,1)}
.tab-fade{animation:in .22s ease-out}
.tb.on.pop{animation:pop .32s cubic-bezier(.2,.9,.3,1)}
@media (prefers-reduced-motion:reduce){.body.tab-in-r,.body.tab-in-l,.tb.on.pop{animation:in .15s ease-out}}
.tabbar{position:fixed;z-index:20;left:max(24px,calc(50% - 216px));bottom:calc(max(24px,calc(env(safe-area-inset-bottom) + 12px)) + 1px);display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.6);backdrop-filter:blur(14px) saturate(1.6);box-shadow:var(--sh),inset 0 0 0 1px rgba(255,255,255,.6)}
.tb{height:44px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);transition:background .15s,padding .15s}
.tb .lbl{display:none;font-size:14px;line-height:1.2;font-weight:500}
.tb.on{padding:0 18px 0 16px;color:var(--accent-ink);background:var(--glass-hi);box-shadow:inset 0 0 0 1px var(--glass-edge),0 2px 8px rgba(38,33,20,.08)}
.tb.on .lbl{display:inline}
.addc{background:none;box-shadow:none;border:1.5px dashed var(--ph);align-items:center;justify-content:center;gap:9px;padding:0 16px;text-align:center;min-height:194px}
.addc .bm-m{max-width:118px}
.deck{position:relative;width:312px;height:272px}
.deck>*{position:absolute;transform-origin:0 0}
.deck .dk{width:150px;opacity:.6;box-shadow:none}
.deck .dk.l{left:6px;top:52px;transform:rotate(-12deg)}
.deck .dk.r{left:176px;top:20px;transform:rotate(12deg)}
.deck .rc .tile{height:120px}
.dfront{left:66px;top:8px;width:176px;transform:rotate(3deg);background:var(--card);border-radius:28px;padding:7px;box-shadow:0 12px 28px rgba(38,33,20,.14)}
.dfront .tile{height:140px;border-radius:22px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.dic{width:52px;height:52px;border-radius:999px;background:var(--card);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.dfront .tx{padding:14px 9px 10px;display:flex;flex-direction:column;gap:2px}
/* ---------- end of recipe ---------- */
.screen.done{padding-top:0}
.dcover{flex:1;min-height:380px;background:var(--accent);display:flex;align-items:center;justify-content:center;padding:max(56px,calc(env(safe-area-inset-top) + 40px)) 24px 52px}
.dstage{position:relative;width:203px}
.dcard{width:203px;transform:rotate(4deg);box-shadow:0 18px 40px rgba(0,0,0,.18);pointer-events:none}
.dcard .tile{height:162px;border-radius:24px}
.dcard .tile .ill{width:86%;height:86%}
.dcard .tx{padding:16px 11px 14px}
.dcard .nm{font-size:20px;letter-spacing:-.02em}
.dfav{position:absolute;top:-2px;right:-16px;width:60px;height:60px;color:var(--accent-ink)}
.dsheet{position:relative;margin-top:-28px;background:var(--bg);border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:8px;padding:28px var(--gxr) max(24px,calc(env(safe-area-inset-bottom) + 12px)) var(--gx)}
/* ---------- detail ---------- */
.hero{height:max(340px,calc(328px + env(safe-area-inset-top)));background:var(--accent);position:relative;display:flex;align-items:flex-end;justify-content:center;margin-top:calc(-1 * max(12px,env(safe-area-inset-top)));padding-top:max(12px,env(safe-area-inset-top));overflow:hidden}
.hero .art{width:240px;height:180px;margin-bottom:56px}
.hero .ph{position:absolute;inset:0}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25),transparent 45%)}
.hero .nav{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));z-index:2}
.sheetc{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-28px;position:relative;flex:1;display:flex;flex-direction:column;gap:24px;padding:28px var(--gxr) 24px var(--gx)}
.titleRow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.titleRow .tm{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-top:2px}

.cbar{position:fixed;top:0;left:0;right:0;max-width:480px;margin:0 auto;z-index:30;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .18s,transform .18s}
.cbar.on{opacity:1;transform:none;pointer-events:auto}
.cbar .cbt{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
/* ---------- options rows (sheets) ---------- */
.opt{display:flex;align-items:center;gap:16px;min-height:72px;width:100%}
.opt .oi{width:48px;height:48px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none}
.opt .ot{flex:1;min-width:0}
.opt .ch{color:var(--muted)}
.opt.danger .oi{background:var(--danger-soft);color:var(--danger)}

/* ---------- layer: sheets ---------- */
#layer{position:fixed;inset:0;z-index:50;pointer-events:none}
#layer.open{pointer-events:auto}
#layer .dim{position:absolute;inset:-50vh 0;background:var(--dim);opacity:0;transition:opacity .2s}
html,body{transition:background-color .2s}

.tut{display:flex;flex-direction:column;gap:10px;padding:4px 8px 8px}

.tdots i.on{background:var(--accent)}

/* ---------- liquid glass (Figma: Glass/Regular, fill bg/glass = white 55%) ----------
   Safari can't refract, so the glass is: the 55% white fill, a blur, a rim lit from the
   top-left (-45°), a soft shade on the opposite inner edge (depth) and a specular sheen. */
:root{
  --g-fill:rgba(255,255,255,.55);
  --g-blur:blur(12px) saturate(1.7);
  --g-drop:0 6px 18px rgba(38,33,20,.10);
  --g-rim:inset 0 0 0 1px rgba(255,255,255,.8),
          inset 2px 2px 3px rgba(255,255,255,.95),
          inset -2px -3px 6px rgba(38,33,20,.07),
          inset 0 0 16px rgba(255,255,255,.4);
  --g-shine:linear-gradient(135deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 45%,rgba(255,255,255,0) 75%,rgba(255,255,255,.25) 100%);
}
.ib:not(.dark):not(.avatar),.ib.avatar,.avatar.big,.stepper,.search,.toast{position:relative}
.ib.wfav,.ib.dfav{position:absolute}
.ib:not(.dark),.avatar.big,.stepper,.search,.toast,.tabbar{
  isolation:isolate;background:var(--g-fill);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:var(--g-drop),var(--g-rim)}
.ib:not(.dark)::before,.avatar.big::before,.stepper::before,.search::before,.toast::before,.tabbar::before,.tb.on::before,.sheet::before,.rc:not(.addc)::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:var(--g-shine)}
/* active tab: clearer glass inside the bar */
.tb.on{position:relative;isolation:isolate;background:rgba(255,255,255,.72);box-shadow:0 2px 8px rgba(38,33,20,.08),inset 0 0 0 1px rgba(255,255,255,.9),inset 2px 2px 3px #fff,inset -2px -2px 5px rgba(38,33,20,.06)}
/* recipe cards and their drawing tile: Glass/Regular too (no blur, the page behind is flat) */
.rc:not(.addc){isolation:isolate;background:var(--g-fill);box-shadow:var(--g-drop),var(--g-rim)}
.rc:not(.addc) .tile{background:rgba(255,255,255,.55);box-shadow:0 6px 18px rgba(38,33,20,.06),inset 0 0 0 1px rgba(255,255,255,.8),inset 2px 2px 3px rgba(255,255,255,.9),inset -2px -3px 6px rgba(38,33,20,.06)}
/* blue ones stay as they were: subtle */
.fab{background:rgba(58,81,113,.92);box-shadow:var(--sh-accent),inset 0 1px 0 rgba(255,255,255,.25)}
.ib.dark{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1px 0 rgba(255,255,255,.3)}
/* sheets: Glass/Sheet, opaque enough to read */
.sheet{isolation:isolate;box-shadow:0 16px 48px rgba(26,20,13,.14),inset 0 0 0 1px rgba(255,255,255,.6),inset 2px 2px 3px rgba(255,255,255,.95),inset 0 0 22px rgba(255,255,255,.35)}
.sheet::before{background:linear-gradient(160deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 30%)}
/* ---------- toasts ---------- */
#toasts{position:fixed;left:0;right:0;bottom:max(108px,calc(env(safe-area-inset-bottom) + 100px));z-index:60;display:flex;justify-content:center;pointer-events:none;padding:0 16px}

function illKey(r){
  const nm=norm(r&&r.name);
  if(/\b(sopa|caldo|locro|guiso|crema de|puchero|estofado|cazuela)/.test(nm))return"sopa";
  if(/\b(tarta|torta|pie|flan|tiramisu|postre|budin|bizcochuelo|alfajor|galletit|mousse|helado|brownie|cheesecake|pastel|dulce)/.test(nm))return"tarta";
  if(/\b(fideo|pasta|ragu|noqui|tallarin|ravioli|lasagna|lasana|sorrentino|canelon|spaghetti|risotto|arroz)/.test(nm))return"pasta";
  if(r&&r.category==="Sopas")return"sopa";
  if(r&&r.category==="Dulces")return"tarta";
  if(r&&r.category==="Pastas")return"pasta";
  if(r&&DRAW[r.drawing])return r.drawing;
  if(r&&ALIAS[r.drawing])return ALIAS[r.drawing];
  const id=String(r&&r.id||"x");let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return ILL_KEYS[h%3];
}

const recRef=id=>F.fs.doc(F.db,"recipes",id);

async function putRecipe(r){
  if(!r.ownerId){r.ownerId=uid();}
  if(isMine(r))r.ownerName=myName();
  r.updatedAt=Date.now();
  const i=S.recipes.findIndex(x=>x.id===r.id);
  if(i>=0)S.recipes[i]=r;else S.recipes.unshift(r);
  render();

  const data=clone(r);delete data.fav;
  try{await serial(r.id,()=>F.fs.setDoc(recRef(r.id),data));return true}catch(e){onWriteErr(e);return false}
}
async function delRecipe(id){
  S.recipes=S.recipes.filter(x=>x.id!==id);render();
  if(DEMO){demoSave();return}
  try{await serial(id,()=>F.fs.deleteDoc(recRef(id)))}catch(e){onWriteErr(e)}
}
async function saveUser(patch){
  if(DEMO){demoSave();return}
  try{await serial("_user",()=>F.fs.setDoc(userRef(),patch,{merge:true}))}catch(e){onWriteErr(e)}
}
async function setState(patch){
  S.state=Object.assign({},S.state,patch);

}

  const timer=setTimeout(()=>{if(!S.ready){S.slow=true;gotUser=gotRecs=true;S.profile=S.profile||{};done();}},10000);
  unsubs.push(F.fs.onSnapshot(userRef(),snap=>{

/* ================= helpers: quantities ================= */
const VULG={"½":.5,"¼":.25,"¾":.75,"⅓":1/3,"⅔":2/3};
function parseQty(text){
  const t=String(text||"").trim();
  const m=t.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?\s*[½¼¾⅓⅔]?|[½¼¾⅓⅔])(?=\s|[a-zA-Z]|$)/);
  if(!m)return null;
  let s=m[1].trim(),v=0;
  const vul=s.match(/[½¼¾⅓⅔]/);if(vul){v+=VULG[vul[0]];s=s.replace(vul[0],"").trim();}
  if(s){
    if(/\s/.test(s)&&s.includes("/")){const[a,b]=s.split(/\s+/);const[n,d]=b.split("/");v+=+a+(+n/+d);}
    else if(s.includes("/")){const[n,d]=s.split("/");v+=+n/+d;}
    else v+=parseFloat(s.replace(",","."));
  }
  return{v,rest:t.slice(m[0].length)};
}
function fmtQty(v){
  if(v>=10)return String(Math.round(v));
  const whole=Math.floor(v+1e-9),fr=v-whole;
  const opts=[[0,""],[.25,"¼"],[1/3,"⅓"],[.5,"½"],[2/3,"⅔"],[.75,"¾"],[1,""]];
  let best=opts[0],bd=9;for(const o of opts){const d=Math.abs(fr-o[0]);if(d<bd){bd=d;best=o;}}
  let w=whole+(best[0]===1?1:0);const f=best[0]===1?"":best[1];
  if(bd>.06&&v<10){return (Math.round(v*10)/10).toString().replace(".",",");}
  if(!w&&!f)return (Math.round(v*100)/100).toString().replace(".",",");
  return (w?w:"")+(w&&f?" ":"")+f;
}
function scaleIng(text,factor){
  const p=parseQty(text);
  if(!p||factor===1)return splitIng(text);
  const w=p.rest.trim().split(/\s+/),n=unitLen(p.rest);let unit=w.slice(0,n).join(" ");let v=p.v*factor;
  const u=norm(unit);
  if(/^(g|gr|grs|gramos?)$/.test(u)&&v>=1000){v=v/1000;unit="kg";}
  else if(/^(ml|cc)$/.test(u)&&v>=1000){v=v/1000;unit="l";}
  let q;
  if(n&&/^(g|gr|grs|gramos?|ml|cc)$/.test(norm(unit))&&v>=100)q=String(Math.round(v/5)*5);
  else if(n&&/^(kg|l)$/.test(unit)&&v<10)q=(Math.round(v*10)/10).toString().replace(".",",");
  else q=fmtQty(v);
  return{q:(q+" "+unit).trim(),name:w.slice(n).join(" ").replace(/^de\s+/i,"")};
}
const UNITS=/^(g|gr|grs|gramos?|kg|kilos?|ml|cc|l|lt|litros?|cdas?|cditas?|cucharadas?|cucharaditas?|tazas?|pizcas?|tz|chorritos?|vasos?)$/i;
function unitLen(rest){const w=rest.trim().split(/\s+/);return w[0]&&UNITS.test(w[0].replace(/\.$/,""))?1:0;}
function splitIng(text){
  const p=parseQty(text);if(!p)return{q:"",name:text};
  const n=unitLen(p.rest),w=p.rest.trim().split(/\s+/);
  const qstr=String(text).trim().slice(0,String(text).trim().length-p.rest.length).trim();
  return{q:(qstr+" "+w.slice(0,n).join(" ")).trim(),name:w.slice(n).join(" ").replace(/^de\s+/i,"")};
}
function ingKey(text){const s=splitIng(text).name;const w=norm(s).split(/[ ,(]/).filter(x=>x.length>2&&!["de","del","con","para","los","las","una","uno"].includes(x));return w[0]||"";}
function needsFor(r,stepText){
  const t=norm(stepText);const out=[];
  for(const ing of r.ingredients||[]){const k=ingKey(ing);if(!k)continue;const stem=k.length>4?k.slice(0,k.length-1):k;if(t.includes(stem))out.push(splitIng(ing).name.split(/[,(]/)[0].trim());}
  return [...new Set(out)].slice(0,5);
}
function stepMinutes(text){
  const m=norm(text).match(/(\d+(?:[.,]\d+)?)\s*(?:a\s*\d+\s*)?(minutos?|min|horas?|hs?)\b/);
  if(!m)return 0;let v=parseFloat(m[1].replace(",","."));if(/^h/.test(m[2]))v*=60;return Math.round(v)>0&&v<=600?Math.round(v):0;
}


/* ================= more helpers ================= */
function parseTimeInput(s){
  s=norm(s);if(!s)return 0;
  const h=s.match(/(\d+(?:[.,]\d+)?)\s*(h|hs|hora|horas)\b/);
  const m=s.match(/(\d+)\s*(m|min|mins|minutos?)\b/);
  if(h){let t=Math.round(parseFloat(h[1].replace(",","."))*60);if(m)t+=+m[1];else{const after=s.slice(s.indexOf(h[0])+h[0].length).match(/(\d+)/);if(after)t+=+after[1];}return t;}
  if(m)return +m[1];
  const n=s.match(/(\d+)/);return n?+n[1]:0;
}
function fmtLong(m){m=+m||0;if(!m)return"";if(m<60)return m+" minutos";const h=Math.floor(m/60),r=m%60;return (h===1?"1 hora":h+" horas")+(r?" y "+r+" minutos":"");}
const two=n=>String(n).padStart(2,"0");
const cap1=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
function ingText(text,f){const x=f===1?splitIng(text):scaleIng(text,f);return{q:x.q,name:cap1(x.name||text)};}
function needsList(r,stepText,f){
  const t=norm(stepText);const out=[];
  for(const ing of r.ingredients||[]){const k=ingKey(ing);if(!k)continue;const stem=k.length>4?k.slice(0,k.length-1):k;
    if(t.includes(stem)){const x=ingText(ing,f);const nm=x.name.split(/[,(]/)[0].trim();out.push(x.q?(/[a-z]$/i.test(x.q)?x.q+" de "+nm.toLowerCase():x.q+" "+nm.toLowerCase()):nm);}}
  return [...new Set(out)].slice(0,6);
}
function fmtDate(ts){try{return new Date(ts).toLocaleDateString("es-AR",{day:"numeric",month:"long"})}catch(e){return""}}

let draft=null;
function toDraft(r){
  const d=clone(r);
  d.time=r.time?fmtTime(r.time):"";
  d.ings=(r.ingredients||[]).map(s=>{const x=splitIng(s);return{q:x.q,n:x.q?x.name:s};});
  if(!d.ings.length)d.ings=[{q:"",n:""}];
  d.steps=(r.steps||[]).slice();if(!d.steps.length)d.steps=[""];
  delete d.ingredients;return d;
}
function blank(){return toDraft({id:newId(),name:"",time:0,servings:4,ingredients:[],steps:[],fav:false,createdAt:Date.now()});}
function fromDraft(d){
  const r=clone(d);
  r.name=(r.name||"").trim()||"Receta sin nombre";
  r.time=parseTimeInput(d.time);
  r.servings=Math.max(1,parseInt(r.servings)||1);
  r.ingredients=(d.ings||[]).map(x=>((x.q||"").trim()+" "+(x.n||"").trim()).trim()).filter(Boolean);
  r.steps=(d.steps||[]).map(s=>String(s).trim()).filter(Boolean);
  delete r.ings;if(!r.photo){delete r.photo;delete r.photoCutout;}delete r.drawing;
  return r;
}

/* ================= render ================= */
const app=document.getElementById("app");
let lastKey="";
let fitKey="";
// In the home-screen app, iPhone paints the status bar with theme-color: blue while a blue
// cover is at the top (recipe before scrolling, welcome), the app's gray everywhere else.
// iPhone only accepts theme-color as hex (#F7F6F3), not rgb()
function toHex(c){c=String(c).trim();if(/^#[0-9a-f]{6}$/i.test(c))return c.toUpperCase();const m=String(c).match(/\d+(\.\d+)?/g);if(!m||m.length<3)return "#F7F6F3";return "#"+m.slice(0,3).map(x=>Math.round(+x).toString(16).padStart(2,"0")).join("").toUpperCase();}
function tint(){
  const c=cur(),bar=document.getElementById("cbar"),root=document.documentElement,css=getComputedStyle(root);
  const blue=S.ready&&!S.fail&&(c.n==="welcome"||c.n==="done"||(c.n==="detail"&&!(bar&&bar.classList.contains("on"))));
  const dim=root.classList.contains("dimmed");
  // read the theme tokens, not the live background (it may be mid-transition)
  const col=blue?(dim?"#354A66":"#3A5171"):toHex(css.getPropertyValue(dim?"--bg-dimmed":"--bg").trim());
  const m=document.querySelector('meta[name="theme-color"]');
  if(m&&m.getAttribute("content")!==col)m.setAttribute("content",col);
}
function onScrollBar(){const b=document.getElementById("cbar"),h=document.getElementById("hero");if(!b||!h)return;b.classList.toggle("on",scrollY>Math.max(h.offsetHeight,300)-80);tint();}
window.addEventListener("scroll",onScrollBar,{passive:true});
function grow(el){el.style.height="auto";el.style.height=el.scrollHeight+"px";}
function render(){
  if(S.fail){app.innerHTML=V.offline();return;}

// Removes a plain light background (white or the old beige fill) that touches the edges.
// iPhone turns gallery images into JPEG on upload, so a cut-out plate arrives with a white
// background; this flood-fills it from the borders and leaves the dish with a soft edge.
function whiteCut(c){
  const w=c.width,h=c.height,cx=c.getContext("2d"),id=cx.getImageData(0,0,w,h),d=id.data;
  const near=p=>{const i=p*4,r=d[i],g=d[i+1],b=d[i+2],mn=Math.min(r,g,b);return d[i+3]>0&&mn>226&&Math.max(r,g,b)-mn<24;};
  let tot=0,wh=0;const chk=p=>{tot++;if(near(p))wh++;};
  for(let x=0;x<w;x+=2){chk(x);chk((h-1)*w+x);}for(let y=0;y<h;y+=2){chk(y*w);chk(y*w+w-1);}
  if(!tot||wh/tot<0.85)return false;
  const seen=new Uint8Array(w*h),st=[];
  const push=p=>{if(!seen[p]&&near(p)){seen[p]=1;st.push(p);}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
  while(st.length){const p=st.pop(),x=p%w;if(x>0)push(p-1);if(x<w-1)push(p+1);if(p>=w)push(p-w);if(p<w*(h-1))push(p+w);}
  let cleared=0;for(let p=0;p<w*h;p++)if(seen[p]){d[p*4+3]=0;cleared++;}
  if(cleared<w*h*0.05||cleared>w*h*0.97)return false;
  for(let p=0;p<w*h;p++){if(seen[p])continue;const x=p%w;
    if((x>0&&seen[p-1])||(x<w-1&&seen[p+1])||(p>=w&&seen[p-w])||(p<w*(h-1)&&seen[p+w])){const i=p*4,m=Math.min(d[i],d[i+1],d[i+2]);if(m>170)d[i+3]=Math.max(0,Math.min(255,Math.round(255*(255-m)/85)));}}
  cx.putImageData(id,0,0);return true;
}
// Draws an image scaled to fit `m` px on a transparent canvas.
function drawFit(im,m,bg){let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;const k=Math.min(1,m/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
  const c=document.createElement("canvas");c.width=w;c.height=h;const cx=c.getContext("2d");if(bg){cx.fillStyle=bg;cx.fillRect(0,0,w,h);}cx.drawImage(im,0,0,w,h);return c;}
// Crops a transparent canvas to the dish, leaving a small margin, so it fills the cover like the drawings.
function trimCanvas(c){
  const w=c.width,h=c.height,d=c.getContext("2d").getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1<0)return c;
  const pad=Math.round(Math.max(x1-x0,y1-y0)*0.03);
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
  const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o;
}
function fitCanvas(c,m){const k=Math.min(1,m/Math.max(c.width,c.height));if(k===1)return c;const o=document.createElement("canvas");o.width=Math.max(1,Math.round(c.width*k));o.height=Math.max(1,Math.round(c.height*k));o.getContext("2d").drawImage(c,0,0,o.width,o.height);return o;}
// PNG with transparency, cropped to the dish and shrunk until it fits in the recipe document (~230 KB).
function cutPng(im,max,needsWhiteCut){
  const big=drawFit(im,1600,null);
  if(needsWhiteCut&&!whiteCut(big))return null;
  const t=trimCanvas(big);
  for(const m of [max,720,560,440,340,260]){const out=fitCanvas(t,m).toDataURL("image/png");if(out.length<=230000||m===260)return out;}
  return null;
}
// Shrinks a photo before saving. Cut-out photos (transparent, or on a plain white background)
// are kept as transparent PNG so they sit on the blue cover like the drawings; the rest become JPEG.
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      let alpha=false;
      try{const t=drawFit(im,160,null),d=t.getContext("2d").getImageData(0,0,t.width,t.height).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]<200)n++;alpha=n>(d.length/4)*0.02;}catch(e){}
      if(alpha){res({data:cutPng(im,max,false),cut:true});return;}
      let white=false;try{white=whiteCut(drawFit(im,200,null));}catch(e){}
      if(white){const out=cutPng(im,max,true);if(out){res({data:out,cut:true});return;}}
      const c=drawFit(im,max,"#F1F0EC");let out=c.toDataURL("image/jpeg",q);if(out.length>230000)out=c.toDataURL("image/jpeg",.6);
      if(out.length>230000)out=drawFit(im,Math.round(max*.7),"#F1F0EC").toDataURL("image/jpeg",.65);
      res({data:out,cut:false});
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej();};im.src=url;
  });
}
// Photos saved before cut-outs existed: when the owner opens the recipe, remove the plain
// background once and save it. Checked recipes are marked so this runs only once each.
const fixing=new Set();
function fixOldPhoto(r){
  if(!r||!isMine(r)||!r.photo||fixing.has(r.id))return;
  const jpeg=/^data:image\/jpeg/.test(r.photo);
  const needCut=jpeg&&!r.photoCutout&&!r.photoChecked;
  const needTrim=r.photoCutout&&!r.photoTrim;
  if(!needCut&&!needTrim)return;
  fixing.add(r.id);
  const im=new Image();
  im.onload=async()=>{
    let out=null;try{out=needCut?cutPng(im,900,true):cutPng(im,900,false);}catch(e){}
    const r2=clone(getR(r.id)||r);
    if(out){r2.photo=out;r2.photoCutout=true;r2.photoTrim=true;}else r2.photoChecked=true;
    await putRecipe(r2);
  };
  im.onerror=()=>{};im.src=r.photo;
}

function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||"";
  const delim=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":(first.includes("\t")?"\t":",");
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(f);f="";}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}
    else f+=ch;
  }
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()));
}
function guessField(h){const n=norm(h);
  if(/^(nombre|titulo|receta|name|title)/.test(n))return"name";
  if(/(tiempo|minutos|duracion|time)/.test(n))return"time";
  if(/(porcion|personas|servings|raciones)/.test(n))return"servings";
  if(/(ingrediente|ingredients)/.test(n))return"ingredients";
  if(/(paso|preparacion|instruccion|steps|procedimiento)/.test(n))return"steps";
  return"skip";}
csvIn.addEventListener("change",()=>{
  const file=csvIn.files&&csvIn.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const rows=parseCSV(String(rd.result||""));
    if(rows.length<2){csv={err:"El archivo no tiene recetas o no es un CSV."};if(cur().n!=="csv")reset("csv");else render();return;}
    const headers=rows[0].map(s=>s.trim()),map=headers.map(guessField),seen=new Set();
    map.forEach((m,i)=>{if(m!=="skip"){if(seen.has(m))map[i]="skip";else seen.add(m);}});
    csv={file:file.name,headers,rows:rows.slice(1),map};
    if(cur().n==="csvmap")render();else go("csvmap");
  };
  rd.onerror=()=>{csv={err:"No pudimos leer el archivo."};render();};
  rd.readAsText(file);
});
function splitCell(s){s=String(s||"").trim();if(!s)return[];let parts=s.split(/\r?\n|\|/);if(parts.length===1&&s.includes(";"))parts=s.split(";");return parts.map(x=>x.replace(/^([-•*]|\d+[.)])\s*/,"").trim()).filter(Boolean);}
A.csvRows=()=>{
  const items=csv.rows.map(row=>{
    const r={id:newId(),name:"",time:0,servings:4,ingredients:[],steps:[],fav:false,createdAt:Date.now()};
    csv.map.forEach((m,i)=>{const v=(row[i]||"").trim();
      if(m==="name")r.name=v;else if(m==="time")r.time=parseTimeInput(v);else if(m==="servings")r.servings=parseInt(v)||4;
      else if(m==="ingredients")r.ingredients=splitCell(v);else if(m==="steps")r.steps=splitCell(v);});
    return r;}).filter(r=>r.name);
  const names=new Set(S.recipes.filter(isMine).map(x=>norm(x.name)));
  csv.items=items.map(r=>{const dup=names.has(norm(r.name));return{r,dup,on:!dup};});
  if(!csv.items.length){toast("No encontramos filas con nombre");return;}
  go("csvpick");
};
A.csvToggle=(el)=>{const x=csv.items[+el.dataset.i];x.on=!x.on;keepScroll(()=>{});};
A.csvAll=()=>{const all=csv.items.every(x=>x.on);csv.items.forEach(x=>x.on=!all);keepScroll(()=>{});};
A.csvImport=async()=>{
  const sel=csv.items.filter(x=>x.on).map(x=>x.r);const skipped=csv.items.filter(x=>x.dup&&!x.on);
  let ok=0;const t0=Date.now();for(const r of sel){r.createdAt=t0+ok;if(await putRecipe(r))ok++;else break;}
  csv=null;reset("csvdone",{count:ok,skipped:skipped.length===1?skipped[0].r.name:skipped.length>1?skipped.length+" recetas":""});
};
A.template=async()=>{
  const t='nombre,tiempo,porciones,ingredientes,pasos\n"Tarta de zapallitos",50 min,4,"1 tapa de tarta|3 zapallitos|1 cebolla|3 huevos|100 g de queso rallado","Rallá los zapallitos y salteálos con la cebolla 10 minutos.|Mezclá con los huevos y el queso.|Rellená la tapa y horneá 30 minutos."\n';
  try{const u=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));const a=document.createElement("a");a.href=u;a.download="plantilla-recetas.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
  catch(e){try{await navigator.clipboard.writeText(t);toast("Copiamos la plantilla");}catch(_){toast("No pudimos descargar la plantilla");}}
};

/* cooking */
A.cook=()=>{const c=cur();const r=getR(c.id);cook={id:r.id,step:0,sv:c.sv||r.servings,checked:new Set()};lockOn();go("prep");};
A.resumeCook=()=>{const p=S.state.progress;const r=getR(p.id);cook={id:r.id,step:Math.min(p.step,r.steps.length-1),sv:p.sv||r.servings,checked:new Set()};lockOn();stack=[{n:"home"},{n:"detail",id:r.id},{n:"step"}];scrollTo(0,0);render();};
A.tick=(el)=>{const i=+el.dataset.i;cook.checked.has(i)?cook.checked.delete(i):cook.checked.add(i);keepScroll(()=>{});};
A.startCook=()=>replace("step");
A.leaveCookPrep=()=>{cook=null;lockOff();back();};
A.nextStep=()=>{cook.step++;scrollTo(0,0);render();};
A.prevStep=()=>{cook.step--;scrollTo(0,0);render();};
A.stepsSheet=()=>openSheet({t:"steps"});
A.jumpStep=(el)=>{cook.step=+el.dataset.i;closeSheet();scrollTo(0,0);render();};
A.askExit=()=>openSheet({t:"exit"});
A.exitCook=async()=>{closeSheet();const id=cook.id;await setState({progress:{id,step:cook.step,sv:cook.sv,at:Date.now()}});cook=null;lockOff();reset("detail",{id});};
A.finish=()=>{if(S.state.progress)setState({progress:null});replace("done");};
async function saveDone(){}
A.doneFav=async()=>{if(!cook)return;await toggleFav(cook.id);};
A.doneBack=async()=>{const id=cook.id;await saveDone();cook=null;lockOff();reset("detail",{id});};
A.doneHome=async()=>{await saveDone();cook=null;lockOff();reset();};

/* ================= events ================= */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const f=A[el.dataset.act];if(f){e.preventDefault();f(el);}
});
document.addEventListener("input",e=>{
  const el=e.target;const b=el.dataset&&el.dataset.bind;if(!b)return;
  const c=cur();
  if(b==="q"){c.q=el.value;updateHomeList();return;}
  if(b.startsWith("map."))return;
  if(b==="email"||b==="nm"||b==="pname"){c[b]=el.value;el.classList.remove("err");return;}
  if(!draft)return;
  if(el.tagName==="TEXTAREA")grow(el);
  const[k,i]=b.split(".");
  if(k==="iq")draft.ings[+i].q=el.value;
  else if(k==="in")draft.ings[+i].n=el.value;
  else if(k==="st")draft.steps[+i]=el.value;
  else draft[k]=el.value;
});
document.addEventListener("focusout",e=>{if(e.target&&e.target.id==="f-pname")savePname();});
document.addEventListener("change",e=>{const el=e.target;const b=el.dataset&&el.dataset.bind;if(b&&b.startsWith("map.")){csv.map[+b.slice(4)]=el.value;keepScroll(()=>{});}});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const b=e.target.dataset&&e.target.dataset.bind||"";
  if(e.target.id==="q"||e.target.id==="f-pname"){e.target.blur();return;}
  if(e.target.id==="f-email"){e.preventDefault();(cur().confirm?A.confirmEmail:A.sendLink)();return;}
  if(e.target.id==="f-nm"){e.preventDefault();A.saveName();return;}
  if(draft&&(b.startsWith("in.")||b.startsWith("iq."))){e.preventDefault();const i=+b.split(".")[1];if(i===draft.ings.length-1)A.addIng();else{const n=app.querySelector(`[data-bind="iq.${i+1}"]`);n&&n.focus();}}
});

if(DEMO)window.__demo={go,reset,setCook:o=>{cook=Object.assign(cook||{checked:new Set()},o);},setCsv:o=>{csv=o;}};
render();
initStore();
})();
</script>
